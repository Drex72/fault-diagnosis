; Bench controller firmware (ESP32 DevKit v1, Arduino framework).
; Build:        pio run -e esp32dev
; Flash:        pio run -e esp32dev -t upload
; Logic tests:  pio test -e native        (runs on the laptop, no board needed)

[platformio]
default_envs = esp32dev

[common]
lib_deps = bblanchon/ArduinoJson@7.4.3

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = -DFW_VERSION=\"bench-0.1.0\"
test_ignore = test_native

[env:native]
platform = native
lib_deps = ${common.lib_deps}
build_flags = -std=c++17 -DFW_VERSION=\"bench-native\"
build_src_filter = -<*>   ; src/main.cpp is board glue; only the benchcore library is built here
test_framework = unity
