; Fault-injection controller (second ESP32). Switches fault elements into the
; bench with relays, on command from scripts/run_hardware.py.
; Build: pio run -e esp32dev     Logic tests: pio test -e native

[platformio]
default_envs = esp32dev

[common]
lib_deps = bblanchon/ArduinoJson@7.4.3

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = -DINJ_FW_VERSION=\"injector-0.1.0\"
test_ignore = test_native

[env:native]
platform = native
lib_deps = ${common.lib_deps}
build_flags = -std=c++17 -DINJ_FW_VERSION=\"injector-native\"
build_src_filter = -<*>
test_framework = unity
