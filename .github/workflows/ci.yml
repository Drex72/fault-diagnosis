name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  probe-variants:
    if: github.ref_name == 'experiment/math-engine-v2-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe count and marginal-decision sweep
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-probe
        run: |
          python scripts/run_experiment.py \
            --methods bayes_v2_compound,bayes_v2_probe,bayes_v2_probe1,bayes_v2_probe1_m50,bayes_v2_probe1_m60 \
            --scenarios healthy,F2,F5@motor,C1,C2,TF1,TF2 --trials 10
          python - <<'PY'
          import json
          import statistics
          from pathlib import Path

          path = sorted(Path("/tmp/faultdiag-probe").glob("*/sessions.jsonl"))[-1]
          rows = [json.loads(x) for x in path.read_text().splitlines()]
          methods = [
              "bayes_v2_compound",
              "bayes_v2_probe",
              "bayes_v2_probe1",
              "bayes_v2_probe1_m50",
              "bayes_v2_probe1_m60",
          ]
          scenarios = ["healthy","F2","F5@motor","C1","C2","TF1","TF2"]

          print("\nPROBE VARIANT SWEEP")
          print("| Scenario | Method | Correct | Mean cost | Probes | Wrong | Inconclusive |")
          print("|---|---|---:|---:|---:|---:|---:|")
          for scenario in scenarios:
              for method in methods:
                  rs = [r for r in rows if r["scenario"] == scenario and r["method"] == method]
                  probes = sum(len(r["diagnosis"].get("human_probes") or []) for r in rs)
                  print(
                      f'| {scenario} | {method} | {sum(r["correct"] for r in rs)}/{len(rs)} | '
                      f'{statistics.mean(r["cost"] for r in rs):.1f} | {probes} | '
                      f'{sum(r["status"] == "diagnosed" and not r["correct"] for r in rs)} | '
                      f'{sum(r["status"] == "inconclusive" for r in rs)} |'
                  )

          print("\nTF1 DETAILS")
          for method in methods:
              for r in [x for x in rows if x["scenario"] == "TF1" and x["method"] == method]:
                  print(method, r["seed"], {
                      "status": r["status"],
                      "elements": r["elements"],
                      "cost": r["cost"],
                      "probes": r["diagnosis"].get("human_probes"),
                      "marginals": r["diagnosis"].get("fault_marginals"),
                  })
          PY
