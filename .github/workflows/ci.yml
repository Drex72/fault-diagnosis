# Runs the test suite on every push and pull request. Simulation and mock devices only:
# no hardware, no model server, no internet needed by the tests themselves.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Paired Bayesian V1 vs V2 development benchmark
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-bench
        run: python scripts/run_experiment.py --methods bayes,bayes_v2 --trials 10
