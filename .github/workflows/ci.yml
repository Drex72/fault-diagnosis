# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.head_ref == 'experiment/math-engine-v2' || github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bayesian human-probe threshold sweep
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-bench
        run: |
          python scripts/run_experiment.py \
            --methods bayes_v2_bal6,bayes_v2_human3,bayes_v2_human6,bayes_v2_human10 \
            --scenarios TF1,TF2 --trials 20
          python - <<'PY'
          import json
          from pathlib import Path

          path = sorted(Path("/tmp/faultdiag-bench").glob("*/sessions.jsonl"))[-1]
          rows = [json.loads(x) for x in path.read_text().splitlines()]
          methods = ("bayes_v2_bal6", "bayes_v2_human3", "bayes_v2_human6", "bayes_v2_human10")
          print("\nHUMAN-PROBE SWEEP")
          print("| Scenario | Method | Correct | Wrong | Inconc | Mean cost | Human probes |")
          print("|---|---|---:|---:|---:|---:|---:|")
          for scenario in ("TF1", "TF2"):
              for method in methods:
                  rs = [r for r in rows if r["scenario"] == scenario and r["method"] == method]
                  hp = sum(len(r["diagnosis"].get("human_measurements") or []) for r in rs)
                  print(f'| {scenario} | {method} | {sum(r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"] == "diagnosed" and not r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"] == "inconclusive" for r in rs)}/{len(rs)} | '
                        f'{sum(r["cost"] for r in rs)/len(rs):.1f} | {hp} |')
          print("\nTF1 HUMAN DETAILS")
          for r in rows:
              if r["scenario"] == "TF1" and r["method"].startswith("bayes_v2_human"):
                  print(r["method"], r["seed"], r["status"], r["elements"], r["cost"],
                        r["diagnosis"].get("human_measurements"), r["diagnosis"].get("top"))
          PY
