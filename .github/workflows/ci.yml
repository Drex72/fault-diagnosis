# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.head_ref == 'experiment/math-engine-v2' || github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Profile compound posterior structure
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-profile
        run: |
          python scripts/run_experiment.py --methods bayes_v2_hard --scenarios C1,C2,H2 --trials 30
          python - <<'PY'
          import json, statistics
          from pathlib import Path

          path = sorted(Path("/tmp/faultdiag-profile").glob("*/sessions.jsonl"))[-1]
          rows = [json.loads(x) for x in path.read_text().splitlines()]

          print("\nCOMPOUND-TRIGGER PROFILE")
          for scenario in ("C1","C2","H2"):
              rs=[r for r in rows if r["scenario"]==scenario]
              print("\n", scenario)
              for r in rs:
                  top=r["diagnosis"]["top"]
                  top_p=top[0]["p"]
                  second_p=top[1]["p"] if len(top)>1 else 0
                  top_n=len(top[0]["faults"]) if top[0]["faults"] != ["none"] else 0
                  single_best=max((x["p"] for x in top if len(x["faults"])==1 and x["faults"]!=["none"]), default=0)
                  print({
                    "seed":r["seed"],"correct":r["correct"],"status":r["status"],"cost":r["cost"],
                    "top_faults":top[0]["faults"],"top_p":top_p,"margin":round(top_p-second_p,3),
                    "single_best_top3":single_best,"top3":top,
                  })
          PY
