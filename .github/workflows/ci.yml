name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  probe-variants:
    if: github.ref_name == 'experiment/math-engine-v2-probe'
    strategy:
      fail-fast: false
      matrix:
        method:
          ["bayes_v2_compound","bayes_v2_probe","bayes_v2_probe1","bayes_v2_probe1_m50","bayes_v2_probe1_m60"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe policy — ${{ matrix.method }}
        env:
          METHOD: ${{ matrix.method }}
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-probe
        run: |
          python scripts/run_experiment.py \
            --methods "$METHOD" \
            --scenarios healthy,F2,F5@motor,C1,C2,TF1,TF2 --trials 10
          python - <<'PY'
          import json, os, statistics
          from pathlib import Path

          method=os.environ["METHOD"]
          path=sorted(Path("/tmp/faultdiag-probe").glob("*/sessions.jsonl"))[-1]
          rows=[json.loads(x) for x in path.read_text().splitlines()]
          scenarios=["healthy","F2","F5@motor","C1","C2","TF1","TF2"]

          print("\nPROBE POLICY RESULT", method)
          total_probes=0
          for scenario in scenarios:
              rs=[r for r in rows if r["scenario"]==scenario]
              probes=sum(len(r["diagnosis"].get("human_probes") or []) for r in rs)
              total_probes += probes
              print(scenario, {
                  "correct": f'{sum(r["correct"] for r in rs)}/{len(rs)}',
                  "mean_cost": round(statistics.mean(r["cost"] for r in rs),2),
                  "probes": probes,
                  "wrong": sum(r["status"]=="diagnosed" and not r["correct"] for r in rs),
                  "inconclusive": sum(r["status"]=="inconclusive" for r in rs),
              })

          print("TOTAL", {
              "correct": f'{sum(r["correct"] for r in rows)}/{len(rows)}',
              "mean_cost": round(statistics.mean(r["cost"] for r in rows),3),
              "probes": total_probes,
          })

          if "m50" in method or "m60" in method:
              print("\nTF1 MARGINAL DETAILS")
              for r in [x for x in rows if x["scenario"]=="TF1"]:
                  print(r["seed"], {
                      "elements": r["elements"],
                      "status": r["status"],
                      "cost": r["cost"],
                      "probes": r["diagnosis"].get("human_probes"),
                      "marginals": r["diagnosis"].get("fault_marginals"),
                  })
          PY
