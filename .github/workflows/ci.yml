name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  fit-calibration:
    if: github.ref_name == 'experiment/math-engine-v2-adequacy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Measure aggregate fit on development scenarios
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-fit
        run: |
          python scripts/run_experiment.py --methods bayes_v2_compound --trials 10
          python - <<'PY'
          import json
          import statistics
          from pathlib import Path

          path = sorted(Path("/tmp/faultdiag-fit").glob("*/sessions.jsonl"))[-1]
          rows = [json.loads(x) for x in path.read_text().splitlines()]
          scenarios = list(dict.fromkeys(r["scenario"] for r in rows))

          print("\nAGGREGATE FIT CALIBRATION")
          print("| Scenario | Set | Mean RMS z | Max RMS z | OOD flags | Correct | Mean cost |")
          print("|---|---|---:|---:|---:|---:|---:|")
          for scenario in scenarios:
              rs = [r for r in rows if r["scenario"] == scenario]
              vals = [r["diagnosis"].get("aggregate_fit_rms_z", 0.0) for r in rs]
              print(
                  f'| {scenario} | {rs[0]["set"]} | {statistics.mean(vals):.2f} | {max(vals):.2f} | '
                  f'{sum(r["status"] == "out_of_model" for r in rs)}/{len(rs)} | '
                  f'{sum(r["correct"] for r in rs)}/{len(rs)} | '
                  f'{statistics.mean(r["cost"] for r in rs):.1f} |'
              )

          known = [r["diagnosis"].get("aggregate_fit_rms_z", 0.0) for r in rows if r["set"] in ("single", "compound")]
          held = [r["diagnosis"].get("aggregate_fit_rms_z", 0.0) for r in rows if r["set"] == "heldout"]
          print("\nKNOWN VS HELDOUT")
          print({
              "known_mean": round(statistics.mean(known), 3),
              "known_max": round(max(known), 3),
              "heldout_mean": round(statistics.mean(held), 3),
              "heldout_min": round(min(held), 3),
              "heldout_max": round(max(held), 3),
          })
          PY
