# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.head_ref == 'experiment/math-engine-v2' || github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Topology-aware coupled benchmark
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-topo
        run: |
          python scripts/run_experiment.py \
            --methods bayes_v2_coupled,bayes_v2_coupled_topo,bayes_v2_human_coupled,bayes_v2_human_coupled_topo \
            --scenarios C1,C2,H2,TF1,F5@motor,F4 --trials 20
          python - <<'PY'
          import json
          from pathlib import Path

          path=sorted(Path("/tmp/faultdiag-topo").glob("*/sessions.jsonl"))[-1]
          rows=[json.loads(x) for x in path.read_text().splitlines()]
          methods=("bayes_v2_coupled","bayes_v2_coupled_topo","bayes_v2_human_coupled","bayes_v2_human_coupled_topo")
          print("\nTOPOLOGY-AWARE COMPARISON")
          print("| Scenario | Method | Correct | Wrong | Inconc | OOD | Mean cost | Human |")
          print("|---|---|---:|---:|---:|---:|---:|---:|")
          for s in ("C1","C2","H2","TF1","F5@motor","F4"):
              for m in methods:
                  rs=[r for r in rows if r["scenario"]==s and r["method"]==m]
                  hp=sum(len(r["diagnosis"].get("human_measurements") or []) for r in rs)
                  print(f'| {s} | {m} | {sum(r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="diagnosed" and not r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="inconclusive" for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="out_of_model" for r in rs)}/{len(rs)} | '
                        f'{sum(r["cost"] for r in rs)/len(rs):.1f} | {hp} |')
          PY

      - name: Stress-test genuine cross-branch compounds
        run: |
          python - <<'PY'
          import numpy as np
          from faultdiag.engine_v2_coupled import BayesEngineV2Coupled
          from faultdiag.faults import ATOM_ELEMENT, apply_atoms, sample_healthy
          from faultdiag.guard import PolicyGuard
          from faultdiag.simbench import SimBench

          pairs=(("F3","F4"),("F2","F4"),("F3","F5@lamp"))
          methods={
              "coupled": BayesEngineV2Coupled(balance_z=6.0),
              "coupled_topo": BayesEngineV2Coupled(balance_z=6.0, cross_branch_only=True),
          }
          print("\nCROSS-BRANCH COMPOUND STRESS")
          for atoms in pairs:
              truth=sorted(ATOM_ELEMENT[a] for a in atoms)
              for name,engine in methods.items():
                  ok=ood=cost=0
                  for j in range(20):
                      seed=20000+1000*pairs.index(atoms)+j
                      rng=np.random.default_rng(seed)
                      st=apply_atoms(sample_healthy(rng), atoms, rng)
                      bench=SimBench(st,np.random.default_rng(seed+10000))
                      guard=PolicyGuard(bench)
                      d=engine.run(guard,seed=seed)
                      ok += d["status"]=="diagnosed" and sorted(d.get("elements",[]))==truth
                      ood += d["status"]=="out_of_model"
                      cost += guard.spent
                  print(atoms,name,{"correct":f"{ok}/20","ood":f"{ood}/20","mean_cost":round(cost/20,2)})
          PY
