# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.head_ref == 'experiment/math-engine-v2' || github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Broad V2 comparison on all development scenarios
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-bench
        run: |
          python scripts/run_experiment.py \
            --methods bayes,bayes_v2_hard,bayes_v2_bal6,bayes_v2_coupled,bayes_v2_human_coupled \
            --trials 10
          python - <<'PY'
          import json
          from pathlib import Path

          path = sorted(Path("/tmp/faultdiag-bench").glob("*/sessions.jsonl"))[-1]
          rows = [json.loads(x) for x in path.read_text().splitlines()]
          methods = ("bayes","bayes_v2_hard","bayes_v2_bal6","bayes_v2_coupled","bayes_v2_human_coupled")
          scenarios = list(dict.fromkeys(r["scenario"] for r in rows))
          by={(r["scenario"],r["seed"],r["method"]):r for r in rows}

          print("\nBROAD V2 COMPARISON")
          print("| Scenario | Method | Correct | Wrong | Inconc | OOD | Mean cost | Human probes |")
          print("|---|---|---:|---:|---:|---:|---:|---:|")
          for s in scenarios:
              for m in methods:
                  rs=[r for r in rows if r["scenario"]==s and r["method"]==m]
                  hp=sum(len(r["diagnosis"].get("human_measurements") or []) for r in rs)
                  print(f'| {s} | {m} | {sum(r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="diagnosed" and not r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="inconclusive" for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="out_of_model" for r in rs)}/{len(rs)} | '
                        f'{sum(r["cost"] for r in rs)/len(rs):.1f} | {hp} |')

          print("\nPAIRED DELTAS VS V1")
          for m in methods[1:]:
              wins=losses=ties=0; dc=0.0; n=0
              for s in scenarios:
                  seeds=sorted({r["seed"] for r in rows if r["scenario"]==s})
                  for seed in seeds:
                      a=by[(s,seed,"bayes")]; b=by[(s,seed,m)]
                      wins += bool(b["correct"]) and not bool(a["correct"])
                      losses += bool(a["correct"]) and not bool(b["correct"])
                      ties += bool(a["correct"]) == bool(b["correct"])
                      dc += b["cost"]-a["cost"]; n+=1
              print(m, {"wins":wins,"losses":losses,"ties":ties,"mean_cost_delta":round(dc/n,3)})

          print("\nAGGREGATE BY SET")
          sets=list(dict.fromkeys(r["set"] for r in rows))
          for st in sets:
              for m in methods:
                  rs=[r for r in rows if r["set"]==st and r["method"]==m]
                  print(st,m,{
                    "n":len(rs),
                    "accuracy":round(sum(r["correct"] for r in rs)/len(rs),3),
                    "wrong":round(sum(r["status"]=="diagnosed" and not r["correct"] for r in rs)/len(rs),3),
                    "inconclusive":round(sum(r["status"]=="inconclusive" for r in rs)/len(rs),3),
                    "ood":round(sum(r["status"]=="out_of_model" for r in rs)/len(rs),3),
                    "mean_cost":round(sum(r["cost"] for r in rs)/len(rs),2),
                  })
          PY
