name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  final-math-validation:
    if: github.ref_name == 'experiment/math-engine-robust-final'
    strategy:
      fail-fast: false
      matrix:
        method: ["bayes_v1", "bayes_robust"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Final development validation — ${{ matrix.method }}
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import os
          from faultdiag.engine import BayesEngine
          from faultdiag.engine_robust import BayesEngineRobust
          from faultdiag.harness import dev_scenarios, run_all

          name = os.environ["METHOD"]
          engine = BayesEngine() if name == "bayes_v1" else BayesEngineRobust()

          records = run_all(
              {name: engine.run},
              dev_scenarios(),
              trials=10,
              seed0=90_000,
          )

          print("\nFINAL DEVELOPMENT VALIDATION (seed0=90000; H3/H4 excluded)")
          print({
              "method": name,
              "correct": f'{sum(r["correct"] for r in records)}/{len(records)}',
              "wrong": sum(r["status"] == "diagnosed" and not r["correct"] for r in records),
              "inconclusive": sum(r["status"] == "inconclusive" for r in records),
              "out_of_model": sum(r["status"] == "out_of_model" for r in records),
              "mean_cost": round(sum(r["cost"] for r in records) / len(records), 3),
              "mean_actions": round(sum(r["actions"] for r in records) / len(records), 3),
              "human_probes": sum(len(r["diagnosis"].get("human_probes") or []) for r in records),
              "physics_localisations": sum(
                  bool((r["diagnosis"].get("physics_investigation") or {}).get("elements"))
                  for r in records
              ),
              "suspect_current_readings": sum(
                  len(r["diagnosis"].get("suspect_current_sensors") or [])
                  for r in records
              ),
          })

          print("\nBY SET")
          for group in ("single", "compound", "heldout", "toolfail"):
              rs = [r for r in records if r["set"] == group]
              print(group, {
                  "correct": f'{sum(r["correct"] for r in rs)}/{len(rs)}',
                  "wrong": sum(r["status"] == "diagnosed" and not r["correct"] for r in rs),
                  "inconclusive": sum(r["status"] == "inconclusive" for r in rs),
                  "ood": sum(r["status"] == "out_of_model" for r in rs),
                  "mean_cost": round(sum(r["cost"] for r in rs) / len(rs), 3),
              })

          print("\nBY SCENARIO")
          for scenario in dev_scenarios():
              rs = [r for r in records if r["scenario"] == scenario]
              print(scenario, {
                  "correct": f'{sum(r["correct"] for r in rs)}/{len(rs)}',
                  "wrong": sum(r["status"] == "diagnosed" and not r["correct"] for r in rs),
                  "inconclusive": sum(r["status"] == "inconclusive" for r in rs),
                  "ood": sum(r["status"] == "out_of_model" for r in rs),
                  "mean_cost": round(sum(r["cost"] for r in rs) / len(rs), 2),
                  "probes": sum(len(r["diagnosis"].get("human_probes") or []) for r in rs),
                  "physics": sum(
                      bool((r["diagnosis"].get("physics_investigation") or {}).get("elements"))
                      for r in rs
                  ),
              })
          PY
