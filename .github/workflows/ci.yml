# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.head_ref == 'experiment/math-engine-v2' || github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full development benchmark — V1 vs V2-hard vs V2-balance
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-bench
        run: |
          python scripts/run_experiment.py --methods bayes,bayes_v2_hard,bayes_v2_bal6 --trials 10
          python - <<'PY'
          import json
          from pathlib import Path

          path = sorted(Path("/tmp/faultdiag-bench").glob("*/sessions.jsonl"))[-1]
          rows = [json.loads(x) for x in path.read_text().splitlines()]
          methods = ("bayes", "bayes_v2_hard", "bayes_v2_bal6")
          scenarios = list(dict.fromkeys(r["scenario"] for r in rows))
          by = {(r["scenario"], r["seed"], r["method"]): r for r in rows}

          print("\nFINAL DEVELOPMENT COMPARISON")
          print("| Scenario | Method | Correct | Wrong | Inconc | OOD | Mean cost |")
          print("|---|---|---:|---:|---:|---:|---:|")
          for scenario in scenarios:
              for method in methods:
                  rs = [r for r in rows if r["scenario"] == scenario and r["method"] == method]
                  print(f'| {scenario} | {method} | {sum(r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"] == "diagnosed" and not r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"] == "inconclusive" for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"] == "out_of_model" for r in rs)}/{len(rs)} | '
                        f'{sum(r["cost"] for r in rs)/len(rs):.1f} |')

          print("\nPAIRED DELTAS AGAINST V1")
          for method in methods[1:]:
              wins = losses = ties = 0
              cost_delta = 0.0
              n = 0
              for scenario in scenarios:
                  seeds = sorted({r["seed"] for r in rows if r["scenario"] == scenario})
                  for seed in seeds:
                      a = by[(scenario, seed, "bayes")]
                      b = by[(scenario, seed, method)]
                      wins += int(bool(b["correct"]) and not bool(a["correct"]))
                      losses += int(bool(a["correct"]) and not bool(b["correct"]))
                      ties += int(bool(a["correct"]) == bool(b["correct"]))
                      cost_delta += b["cost"] - a["cost"]
                      n += 1
              print(method, {
                  "wins_where_v1_wrong": wins,
                  "losses_where_v1_right": losses,
                  "accuracy_ties": ties,
                  "mean_cost_delta": round(cost_delta/n, 3),
              })
          PY
