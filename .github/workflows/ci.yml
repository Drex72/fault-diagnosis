# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.event_name == 'push' && github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calibrate nested sensor-physical DMM gate at K32 N64
        run: |
          python - <<'PY'
          from collections import defaultdict
          from faultdiag.engine_v2_coupled import BayesEngineV2HumanCoupled
          from faultdiag.guard import PolicyGuard
          from faultdiag.harness import make_bench, SCENARIOS, truth_elements

          thresholds=(0.05,0.075,0.10,0.125,0.15,0.20)
          scenarios=("C2","F5@motor","TF1")
          stats=defaultdict(lambda:{"n":0,"ok":0,"wrong":0,"inc":0,"ood":0,"cost":0,"human":0})
          for th in thresholds:
              e=BayesEngineV2HumanCoupled(
                  n_samples=32,n_eig_samples=64,
                  balance_z=6.0,cross_branch_only=True,
                  allow_sensor_ambiguity=True,
                  min_human_score=0.006,min_sensor_human_score=0.006,
                  sensor_fault_mass_threshold=0.50,
                  sensor_nested_pair_threshold=th,
              )
              for scenario in scenarios:
                  truth=truth_elements(SCENARIOS[scenario])
                  for trial in range(20):
                      seed=list(SCENARIOS).index(scenario)*1000+trial
                      g=PolicyGuard(make_bench(scenario,seed))
                      d=e.run(g,seed=seed)
                      s=stats[(th,scenario)]
                      s["n"]+=1
                      correct=d["status"]=="diagnosed" and sorted(d.get("elements",[]))==truth
                      s["ok"]+=correct
                      s["wrong"]+=d["status"]=="diagnosed" and not correct
                      s["inc"]+=d["status"]=="inconclusive"
                      s["ood"]+=d["status"]=="out_of_model"
                      s["cost"]+=g.spent
                      s["human"]+=len(d.get("human_measurements") or [])

          print("\nNESTED DMM GATE SWEEP — K32 N64")
          print("| Pair mass | Scenario | Correct | Wrong | Inconc | OOD | Mean cost | Human probes |")
          print("|---:|---|---:|---:|---:|---:|---:|---:|")
          for th in thresholds:
              for scenario in scenarios:
                  s=stats[(th,scenario)]
                  print(f'| {th:.3f} | {scenario} | {s["ok"]}/{s["n"]} | {s["wrong"]}/{s["n"]} | '
                        f'{s["inc"]}/{s["n"]} | {s["ood"]}/{s["n"]} | {s["cost"]/s["n"]:.2f} | {s["human"]} |')
          PY
