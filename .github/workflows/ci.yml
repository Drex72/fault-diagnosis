name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  adequacy-validation:
    if: github.ref_name == 'experiment/math-engine-v2-adequacy'
    strategy:
      fail-fast: false
      matrix:
        threshold: ["none", "1.5", "2.0", "3.0"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fresh-seed adequacy validation — threshold ${{ matrix.threshold }}
        env:
          THRESHOLD: ${{ matrix.threshold }}
        run: |
          python - <<'PY'
          import os
          from faultdiag.engine_v2 import BayesEngineV2
          from faultdiag.harness import run_all

          raw = os.environ["THRESHOLD"]
          threshold = None if raw == "none" else float(raw)
          scenarios = [
              "healthy", "F1", "F1b", "F2", "F3", "F4",
              "F5@motor", "F5@lamp", "F5@load", "C1", "C2", "H1", "H2",
          ]
          engine = BayesEngineV2(
              min_confirm_score=1.0,
              challenge_complex_hypothesis=True,
              aggregate_misfit_z=threshold,
          )
          records = run_all(
              {f"adequacy_{raw}": engine.run},
              scenarios,
              trials=10,
              seed0=20_000,
          )
          known = [r for r in records if r["set"] in ("single", "compound")]
          h1 = [r for r in records if r["scenario"] == "H1"]
          h2 = [r for r in records if r["scenario"] == "H2"]

          print("\nADEQUACY VALIDATION RESULT")
          print({
              "threshold": raw,
              "known_correct": f'{sum(r["correct"] for r in known)}/{len(known)}',
              "known_false_ood": f'{sum(r["status"] == "out_of_model" for r in known)}/{len(known)}',
              "H1_ood": f'{sum(r["status"] == "out_of_model" for r in h1)}/{len(h1)}',
              "H2_ood": f'{sum(r["status"] == "out_of_model" for r in h2)}/{len(h2)}',
              "mean_cost": round(sum(r["cost"] for r in records)/len(records), 3),
          })
          print("\nPER-SCENARIO")
          for scenario in scenarios:
              rs=[r for r in records if r["scenario"] == scenario]
              print(scenario, {
                  "correct": sum(r["correct"] for r in rs),
                  "ood": sum(r["status"] == "out_of_model" for r in rs),
                  "mean_cost": round(sum(r["cost"] for r in rs)/len(rs), 2),
                  "fit_min": round(min(r["diagnosis"].get("aggregate_fit_rms_z",0) for r in rs),3),
                  "fit_max": round(max(r["diagnosis"].get("aggregate_fit_rms_z",0) for r in rs),3),
              })
          PY
