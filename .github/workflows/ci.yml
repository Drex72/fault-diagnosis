# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.head_ref == 'experiment/math-engine-v2' || github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inspect F4 and TF1 failure traces
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-bench
        run: |
          python scripts/run_experiment.py --methods bayes,bayes_v2_bal6 --scenarios F4,TF1 --trials 10
          python - <<'PY'
          import json
          from pathlib import Path

          path = sorted(Path("/tmp/faultdiag-bench").glob("*/sessions.jsonl"))[-1]
          rows = [json.loads(x) for x in path.read_text().splitlines()]
          for r in rows:
              print("\nTRACE", r["scenario"], r["method"], r["seed"],
                    "status=", r["status"], "elements=", r["elements"], "cost=", r["cost"])
              print("top=", r["diagnosis"].get("top"))
              for e in r["history"]:
                  print(" ", e.get("tool"), e.get("args"), e.get("status"), e.get("data"))
          PY
