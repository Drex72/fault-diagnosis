# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.event_name == 'push' && github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sensor-ambiguity human-probe A/B
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-sensor-human
        run: |
          python scripts/run_experiment.py \
            --methods bayes_v2_coupled_topo,bayes_v2_human_coupled_topo,bayes_v2_human_coupled_sensor \
            --scenarios C2,F5@motor,F5@lamp,F5@load,TF1,H2 --trials 15
          python - <<'PY'
          import json
          from pathlib import Path
          path=sorted(Path("/tmp/faultdiag-sensor-human").glob("*/sessions.jsonl"))[-1]
          rows=[json.loads(x) for x in path.read_text().splitlines()]
          methods=("bayes_v2_coupled_topo","bayes_v2_human_coupled_topo","bayes_v2_human_coupled_sensor")
          scenarios=("C2","F5@motor","F5@lamp","F5@load","TF1","H2")
          print("\nSENSOR-AMBIGUITY HUMAN A/B")
          print("| Scenario | Method | Correct | Wrong | Inconc | OOD | Mean cost | Human sessions/probes |")
          print("|---|---|---:|---:|---:|---:|---:|---:|")
          for s in scenarios:
              for m in methods:
                  rs=[r for r in rows if r["scenario"]==s and r["method"]==m]
                  sessions=sum(bool(r["diagnosis"].get("human_measurements")) for r in rs)
                  probes=sum(len(r["diagnosis"].get("human_measurements") or []) for r in rs)
                  print(f'| {s} | {m} | {sum(r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="diagnosed" and not r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="inconclusive" for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"]=="out_of_model" for r in rs)}/{len(rs)} | '
                        f'{sum(r["cost"] for r in rs)/len(rs):.1f} | {sessions}/{probes} |')
          print("\nSENSOR HUMAN DETAILS")
          for r in rows:
              if r["method"]=="bayes_v2_human_coupled_sensor" and r["diagnosis"].get("human_measurements"):
                  print(r["scenario"],r["seed"],r["status"],r["elements"],r["cost"],
                        r["diagnosis"]["human_measurements"],r["diagnosis"].get("top"))
          PY
