name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  residual-benchmark:
    if: github.ref_name == 'experiment/math-engine-v3-residual'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Conservation-residual localisation benchmark
        run: |
          python - <<'PY'
          from faultdiag.engine_v2 import BayesEngineV2
          from faultdiag.engine_v3 import BayesEngineV3Residual
          from faultdiag.harness import run_all

          scenarios = [
              "healthy","F1","F2","F3","F4","F5@motor","F5@lamp","F5@load",
              "C1","C2","H1","H2",
          ]
          v2 = BayesEngineV2(min_confirm_score=1.0, challenge_complex_hypothesis=True)
          v3 = BayesEngineV3Residual(min_confirm_score=1.0, challenge_complex_hypothesis=True)
          records = run_all(
              {"v2_compound": v2.run, "v3_residual": v3.run},
              scenarios,
              trials=10,
              seed0=0,
          )

          print("\nRESIDUAL LOCALISATION BENCHMARK")
          print("| Scenario | Method | Correct | OOD | Mean cost |")
          print("|---|---|---:|---:|---:|")
          for scenario in scenarios:
              for method in ("v2_compound","v3_residual"):
                  rs=[r for r in records if r["scenario"]==scenario and r["method"]==method]
                  print(
                      f'| {scenario} | {method} | {sum(r["correct"] for r in rs)}/{len(rs)} | '
                      f'{sum(r["status"]=="out_of_model" for r in rs)}/{len(rs)} | '
                      f'{sum(r["cost"] for r in rs)/len(rs):.1f} |'
                  )

          print("\nPHYSICS INVESTIGATIONS")
          for r in records:
              if r["method"]=="v3_residual" and r["scenario"] in ("H1","H2"):
                  print(r["scenario"], r["seed"], {
                      "status": r["status"],
                      "elements": r["elements"],
                      "cost": r["cost"],
                      "physics": r["diagnosis"].get("physics_investigation"),
                  })
          PY
