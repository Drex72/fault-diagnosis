# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.event_name == 'push' && github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trace C2 regression under coupled particles
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-c2
        run: |
          python scripts/run_experiment.py \
            --methods bayes_v2_hard,bayes_v2_coupled_topo,bayes_v2_human_coupled_topo \
            --scenarios C2,F5@motor --trials 20
          python - <<'PY'
          import json
          from pathlib import Path
          path=sorted(Path("/tmp/faultdiag-c2").glob("*/sessions.jsonl"))[-1]
          rows=[json.loads(x) for x in path.read_text().splitlines()]
          print("\nC2 / SENSOR TRACE")
          for r in rows:
              if r["method"]=="bayes_v2_hard":
                  continue
              d=r["diagnosis"]
              print({
                "scenario":r["scenario"],"method":r["method"],"seed":r["seed"],
                "correct":r["correct"],"status":r["status"],"elements":r["elements"],
                "cost":r["cost"],"top":d.get("top"),
                "failed":[(h["tool"],h["args"],h["status"]) for h in r["history"] if h["status"]!="ok"],
                "actions":[(h["tool"],h["args"],h.get("data")) for h in r["history"]],
                "human":d.get("human_measurements"),
              })
          PY
