# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.event_name == 'push' && github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calibrate nested sensor-physical ambiguity gate
        run: |
          python - <<'PY'
          from collections import defaultdict
          from faultdiag.engine_v2_coupled import BayesEngineV2HumanCoupled
          from faultdiag.guard import PolicyGuard
          from faultdiag.harness import make_bench, SCENARIOS, truth_elements

          nested_thresholds=(0.0,0.01,0.02,0.03,0.05)
          scenarios=("C2","F5@motor")
          engines={
              t: BayesEngineV2HumanCoupled(
                  balance_z=6.0, cross_branch_only=True,
                  allow_sensor_ambiguity=True,
                  min_human_score=0.006,
                  min_sensor_human_score=0.006,
                  sensor_fault_mass_threshold=0.50,
                  sensor_nested_pair_threshold=t,
              )
              for t in nested_thresholds
          }
          stats=defaultdict(lambda:{"n":0,"ok":0,"wrong":0,"cost":0,"human":0,"sensor_human":0})
          for scenario in scenarios:
              truth=truth_elements(SCENARIOS[scenario])
              for trial in range(20):
                  seed=list(SCENARIOS).index(scenario)*1000+trial
                  for t,e in engines.items():
                      g=PolicyGuard(make_bench(scenario,seed))
                      d=e.run(g,seed=seed)
                      s=stats[(t,scenario)]
                      s["n"]+=1
                      correct=d["status"]=="diagnosed" and sorted(d.get("elements",[]))==truth
                      s["ok"]+=correct
                      s["wrong"]+=d["status"]=="diagnosed" and not correct
                      s["cost"]+=g.spent
                      hs=d.get("human_measurements") or []
                      s["human"]+=len(hs)
                      s["sensor_human"]+=sum(x.get("trigger")=="sensor_ambiguity" for x in hs)

          print("\nNESTED SENSOR AMBIGUITY SWEEP")
          print("| Nested p | Scenario | Correct | Wrong | Mean cost | Human probes |")
          print("|---:|---|---:|---:|---:|---:|")
          for t in nested_thresholds:
              for scenario in scenarios:
                  s=stats[(t,scenario)]
                  print(f'| {t:.2f} | {scenario} | {s["ok"]}/{s["n"]} | {s["wrong"]}/{s["n"]} | '
                        f'{s["cost"]/s["n"]:.2f} | {s["human"]} |')
          PY
