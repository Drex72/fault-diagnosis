# Production tests plus branch-only mathematical-engine experiments.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  math-benchmark:
    if: github.head_ref == 'experiment/math-engine-v2' || github.ref_name == 'experiment/math-engine-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: KCL model-adequacy threshold sweep
        env:
          FAULTDIAG_RESULTS_DIR: /tmp/faultdiag-bench
        run: |
          python scripts/run_experiment.py \
            --methods bayes_v2_hard,bayes_v2_compound,bayes_v2_kcl4,bayes_v2_kcl5,bayes_v2_kcl6 \
            --scenarios C1,C2,H1,H2 --trials 20
          python - <<'PY'
          import json
          from pathlib import Path

          path = sorted(Path("/tmp/faultdiag-bench").glob("*/sessions.jsonl"))[-1]
          rows = [json.loads(x) for x in path.read_text().splitlines()]
          methods = ("bayes_v2_hard", "bayes_v2_compound", "bayes_v2_kcl4", "bayes_v2_kcl5", "bayes_v2_kcl6")
          scenarios = ("C1", "C2", "H1", "H2")

          print("\nKCL THRESHOLD SWEEP")
          print("| Scenario | Method | Correct | Wrong | OOD | Mean cost | Probe z median |")
          print("|---|---|---:|---:|---:|---:|---:|")
          for scenario in scenarios:
              for method in methods:
                  rs = [r for r in rows if r["scenario"] == scenario and r["method"] == method]
                  zs = [r["diagnosis"].get("consistency_probe", {}).get("z")
                        for r in rs if r["diagnosis"].get("consistency_probe")]
                  zs = sorted(z for z in zs if z is not None)
                  median = zs[len(zs)//2] if zs else None
                  print(f'| {scenario} | {method} | {sum(r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"] == "diagnosed" and not r["correct"] for r in rs)}/{len(rs)} | '
                        f'{sum(r["status"] == "out_of_model" for r in rs)}/{len(rs)} | '
                        f'{sum(r["cost"] for r in rs)/len(rs):.1f} | {median} |')

          print("\nKCL PROBE DETAILS")
          for method in methods[2:]:
              for scenario in scenarios:
                  rs = [r for r in rows if r["scenario"] == scenario and r["method"] == method]
                  probes = [r["diagnosis"].get("consistency_probe") for r in rs
                            if r["diagnosis"].get("consistency_probe")]
                  print(method, scenario, probes)
          PY
