name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  observability-probe:
    if: github.ref_name == 'experiment/math-engine-v2-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fresh-seed observability-aware probe validation
        run: |
          python - <<'PY'
          from faultdiag.methods import build_methods
          from faultdiag.harness import run_all

          methods, _ = build_methods(["bayes_v2_probe1", "bayes_v2_probe_obs"])
          scenarios = ["healthy","F5@motor","C2","TF1"]
          records = run_all(methods, scenarios, trials=10, seed0=60_000)

          print("\nOBSERVABILITY-AWARE PROBE VALIDATION (seed0=60000)")
          for method in methods:
              rs=[r for r in records if r["method"]==method]
              print(method, {
                  "correct": f'{sum(r["correct"] for r in rs)}/{len(rs)}',
                  "mean_cost": round(sum(r["cost"] for r in rs)/len(rs),3),
                  "probes": sum(len(r["diagnosis"].get("human_probes") or []) for r in rs),
              })
              for scenario in scenarios:
                  xs=[r for r in rs if r["scenario"]==scenario]
                  print(" ",scenario,{
                      "correct":f'{sum(r["correct"] for r in xs)}/{len(xs)}',
                      "mean_cost":round(sum(r["cost"] for r in xs)/len(xs),2),
                      "wrong":sum(r["status"]=="diagnosed" and not r["correct"] for r in xs),
                      "inconclusive":sum(r["status"]=="inconclusive" for r in xs),
                      "probes":sum(len(r["diagnosis"].get("human_probes") or []) for r in xs),
                  })

          print("\nTF1 OBSERVABILITY DETAILS")
          for r in records:
              if r["method"]=="bayes_v2_probe_obs" and r["scenario"]=="TF1":
                  print(r["seed"],{
                      "status":r["status"],
                      "elements":r["elements"],
                      "cost":r["cost"],
                      "probes":r["diagnosis"].get("human_probes"),
                      "masked":r["diagnosis"].get("unobservable_atoms"),
                      "marginals":r["diagnosis"].get("fault_marginals"),
                  })
          PY
