name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  fresh-seed-validation:
    if: github.ref_name == 'experiment/math-engine-v2-validation'
    strategy:
      fail-fast: false
      matrix:
        method: ["bayes", "v2_hard", "v2_compound"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fresh-seed V1/V2 replication — ${{ matrix.method }}
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import os
          from faultdiag.engine import BayesEngine
          from faultdiag.engine_v2 import BayesEngineV2
          from faultdiag.harness import dev_scenarios, run_all

          name = os.environ["METHOD"]
          if name == "bayes":
              engine = BayesEngine()
          elif name == "v2_hard":
              engine = BayesEngineV2(min_confirm_score=1.0)
          else:
              engine = BayesEngineV2(
                  min_confirm_score=1.0,
                  challenge_complex_hypothesis=True,
              )

          records = run_all(
              {name: engine.run},
              dev_scenarios(),
              trials=10,
              seed0=30_000,
          )

          print("\nFRESH-SEED REPLICATION (seed0=30000)")
          print({
              "method": name,
              "correct": f'{sum(r["correct"] for r in records)}/{len(records)}',
              "wrong": sum(r["status"] == "diagnosed" and not r["correct"] for r in records),
              "inconclusive": sum(r["status"] == "inconclusive" for r in records),
              "ood": sum(r["status"] == "out_of_model" for r in records),
              "mean_cost": round(sum(r["cost"] for r in records)/len(records), 3),
          })

          print("\nBY SET")
          for group in ("single","compound","heldout","toolfail"):
              rs=[r for r in records if r["set"] == group]
              print(group, {
                  "correct": f'{sum(r["correct"] for r in rs)}/{len(rs)}',
                  "wrong": sum(r["status"] == "diagnosed" and not r["correct"] for r in rs),
                  "inconclusive": sum(r["status"] == "inconclusive" for r in rs),
                  "ood": sum(r["status"] == "out_of_model" for r in rs),
                  "mean_cost": round(sum(r["cost"] for r in rs)/len(rs), 3),
              })

          print("\nBY SCENARIO")
          for scenario in dev_scenarios():
              rs=[r for r in records if r["scenario"] == scenario]
              print(scenario, {
                  "correct": sum(r["correct"] for r in rs),
                  "ood": sum(r["status"] == "out_of_model" for r in rs),
                  "mean_cost": round(sum(r["cost"] for r in rs)/len(rs), 2),
              })
          PY
